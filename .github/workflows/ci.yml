name: CI

# Repo-hygiene baseline (per eps-demo-repo-hygiene): lint -> build -> test.
# The frontend/backend jobs are guarded on the relevant project files existing,
# since a repo freshly generated from eps-demos-template has no app yet. When
# you scaffold the app (see AGENTS.md / `/new-demo`), flesh these out for the
# chosen stack — keep the coverage gates, don't remove them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FAKE_AI: '1' # mandatory per eps-demo-testing-solid — no real AI calls in CI

jobs:
  guidance-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills, agents, and prompt routing
        run: python3 tools/validate-guidance.py

  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep compiles
        run: |
          if [ -f infra/main.bicep ]; then
            az bicep build --file infra/main.bicep --stdout > /dev/null
          else
            echo "No infra/main.bicep — skipping."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test with coverage (>= 60% per eps-demo-testing-solid)
        run: npm run test:coverage
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
        working-directory: backend
      - name: Lint
        run: ruff check app tests
        working-directory: backend
      - name: Test with coverage (>= 70% per eps-demo-testing-solid)
        run: pytest
        working-directory: backend
